# Cluster-specific settings for the knowledge-assistant template.
#
# This is the ONE file to edit when adapting the assistant to a different
# research cluster — no Python changes required. Loaded once by src/config.py.

[cluster]
# Short internal name.
name = "e-conversion"
# Title shown in the browser tab and app header.
display_name = "eConversion Knowledge Assistant"
# One clause describing the cluster, injected into the assistant's system prompt.
description = "the e-conversion energy research cluster, a consortium of ~42 research groups at TUM, LMU, FHI, and MPI focused on energy conversion"
website = "https://e-conversion.de"
# Below: scraped from e-conversion.de/about + e-conversion.de on 2026-09-04. Optional —
# leave a field empty ("" or []) if it doesn't apply to a different cluster.
cluster_id = "EXC 2089/2 - 390776260"
funding_body = "Deutsche Forschungsgemeinschaft (DFG) under Germany's Excellence Strategy"
host_institutions = [
    "Technical University of Munich (TUM)",
    "Ludwig-Maximilians-Universität München (LMU)",
]
participating_institutions = [
    "Technical University of Munich (TUM)",
    "Ludwig-Maximilians-Universität München (LMU)",
    "Max Planck Institute for Solid State Research",
    "Fritz Haber Institute of the Max Planck Society",
    "Deutsches Museum München",
]

[llm]
# OpenAI-compatible chat endpoints. Multiple providers can be defined and are
# selectable in the model picker. default_provider is what a new session starts
# on; if that provider has no API key, the first one that has a key is used.
default_provider = "openrouter"
#
# The model list mirrors the open-weight models GWDG actually serves on
# chat-ai.academiccloud.de (docs list minus the ids the API no longer answers):
# https://docs.hpc.gwdg.de/services/ai-services/chat-ai/models/
# Re-check with:  GET https://chat-ai.academiccloud.de/v1/models
base_url = "https://chat-ai.academiccloud.de/v1"
default_model = "qwen3.8-27b"
models = ["qwen3.8-27b"]

[llm.providers.gwdg]
# Shown in the picker as the fallback when OpenRouter is unavailable.
note = "fallback"
base_url = "https://chat-ai.academiccloud.de/v1"
default_model = "qwen3.8-27b"
models = ["qwen3.8-27b"]

[llm.providers.openrouter]
# API key env var for this provider (not the shared API_KEY used by GWDG)
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
# Only the automatic choice is offered: the cheapest model that satisfies the
# account guardrails, a 1 EUR/M price cap, agentic index >= 35 and tool support.
# default_model is the fallback when the catalogue cannot be reached.
# Only used when the catalogue is unreachable: keep it cheap (a pricey id here
# would be picked silently whenever the fetch fails).
default_model = "deepseek/deepseek-v4-flash-0731"
models = []

# Per-session LLM parameters (the UI's "Parameters" panel). Empty string = do not
# send the field, i.e. use the provider's own default. Can be overridden per
# session; "Reset defaults" in the UI restores exactly these values.
# Deliberately NOT configurable: zero-data-retention routing is always on, and
# temperature / parallel tool calls stay at the provider's defaults.
[llm.params]
reasoning_effort = ""        # "" | minimal | low | medium | high  (reasoning models only)
top_p = ""                    # "" | 0.8 | 0.9 | 0.95 | 1.0
max_tokens = ""               # "" = model default, otherwise 256..32768
# Set by the model picker (cheapest / fastest / lowest latency), not in the panel.
provider_sort = "price"
